      <rect x="170" y="301" height="12" rx="3" fill="#E34C26" opacity=".85" width="0">
<animate attributeName="width" from="0" to="0.1" dur="0.8s" begin="0.6s" fill="freeze"/>      </rect>
      <text x="480" y="311" font-size="11" fill="#648399">0.04%</text>
    </g>
  </g>

