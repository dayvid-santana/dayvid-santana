<animate attributeName="opacity" values=".35;.35;1;.35;.35" keyTimes="0;0.04;0.06;0.10;1" dur="8s" begin="4.8s" repeatCount="indefinite"/>  </circle>
  <circle cx="913.4" cy="289.0" r="2.5" fill="#EAB768" opacity=".35">
