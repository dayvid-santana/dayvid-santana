<!-- DSI GitHub Command Center | Autor: Dayvid Santana | Criado/Editado: 28/08/2026 | Objetivo: Renderizar o console de linguagens + radar de setores de foco. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="ts-title ts-desc">
  <title id="ts-title">DSI — Tech Stack Console</title>
  <desc id="ts-desc">Distribuição de linguagens por peso de código e de tecnologias por setor de foco.</desc>
  <defs>
    <pattern id="ts-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#17384A" stroke-width="1" opacity=".5"/></pattern>
  </defs>
  <rect width="1280" height="440" fill="#06131F"/>
  <rect width="1280" height="440" fill="url(#ts-grid)" opacity=".5"/>
  <rect x="1" y="1" width="1278" height="438" fill="none" stroke="#37677D" stroke-width="2"/>
  <rect x="0" y="-26" width="1280" height="26" fill="#74D9FF" opacity=".07">
    <animate attributeName="y" values="-26;440" dur="8s" repeatCount="indefinite"/>
  </rect>
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="40" y="48" font-size="20" font-weight="700" letter-spacing="2" fill="#EAF6FF">TECH STACK</text>
    <text x="40" y="70" font-size="12" letter-spacing="2" fill="#648399">LANGUAGE &amp; FOCUS BREAKDOWN<tspan fill="#74D9FF"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>_</tspan></text>
    <circle cx="1152" cy="43" r="6" fill="#76D6A5"><animate attributeName="opacity" values="1;.35;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <text x="1168" y="48" font-size="13" font-weight="700" letter-spacing="1" fill="#74D9FF">6 SYSTEMS // 7 LANGUAGES</text>
  </g>
  <path d="M40 90H1240" stroke="#74D9FF" stroke-width="1" opacity=".45"/>
  <line x1="640" y1="100" x2="640" y2="420" stroke="#37677D" stroke-width="1" opacity=".5"/>

  <text x="40" y="112" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2" fill="#648399">LANGUAGE TELEMETRY</text>
  <g font-family="Consolas, 'Courier New', monospace">
    <g>
      <text x="40" y="149" font-size="12" fill="#EAF6FF">Python</text>
      <rect x="170" y="139" height="12" rx="3" fill="#3572A5" opacity=".85" width="0">
<animate attributeName="width" from="0" to="140.2" dur="0.8s" begin="0.0s" fill="freeze"/>      </rect>
      <text x="480" y="149" font-size="11" fill="#648399">48.33%</text>
    </g>
    <g>
      <text x="40" y="176" font-size="12" fill="#EAF6FF">TypeScript</text>
      <rect x="170" y="166" height="12" rx="3" fill="#3178C6" opacity=".85" width="0">
<animate attributeName="width" from="0" to="98.9" dur="0.8s" begin="0.1s" fill="freeze"/>      </rect>
      <text x="480" y="176" font-size="11" fill="#648399">34.1%</text>
    </g>
    <g>
      <text x="40" y="203" font-size="12" fill="#EAF6FF">CSS</text>
      <rect x="170" y="193" height="12" rx="3" fill="#563D7C" opacity=".85" width="0">
<animate attributeName="width" from="0" to="40.3" dur="0.8s" begin="0.2s" fill="freeze"/>      </rect>
