<!-- DSI GitHub Command Center | Autor: Dayvid Santana | Criado/Editado: 28/08/2026 | Objetivo: Renderizar o console animado de capacidades técnicas. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="426" viewBox="0 0 1280 426" role="img" aria-labelledby="cc-title cc-desc">
  <title id="cc-title">DSI — System Capabilities Console</title>
  <desc id="cc-desc">Matriz de prontidão técnica do operador, por tecnologia, status e nível declarado.</desc>
  <defs>
    <pattern id="cc-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#17384A" stroke-width="1" opacity=".5"/></pattern>
  </defs>
  <rect width="1280" height="426" fill="#06131F"/>
  <rect width="1280" height="426" fill="url(#cc-grid)" opacity=".5"/>
  <rect x="1" y="1" width="1278" height="424" fill="none" stroke="#37677D" stroke-width="2"/>
  <rect x="0" y="-26" width="1280" height="26" fill="#74D9FF" opacity=".07">
    <animate attributeName="y" values="-26;426" dur="8s" repeatCount="indefinite"/>
  </rect>
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="40" y="48" font-size="20" font-weight="700" letter-spacing="2" fill="#EAF6FF">SYSTEM CAPABILITIES</text>
    <text x="40" y="70" font-size="12" letter-spacing="2" fill="#648399">READINESS MATRIX // 6 SYSTEMS TRACKED<tspan fill="#74D9FF"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>_</tspan></text>
    <circle cx="1152" cy="43" r="6" fill="#76D6A5"><animate attributeName="opacity" values="1;.35;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <text x="1168" y="48" font-size="13" font-weight="700" letter-spacing="1" fill="#74D9FF">CORE: PYTHON</text>
  </g>
  <path d="M40 90H1240" stroke="#74D9FF" stroke-width="1" opacity=".45"/>
  <g font-family="Consolas, 'Courier New', monospace">
    <g>
      <title>Python — Backend — OPERATIONAL (90%)</title>
      <text x="40" y="121" font-size="15" font-weight="600" fill="#EAF6FF">Python<tspan font-size="12" fill="#648399" dx="8">// BACKEND</tspan></text>
      <rect x="380" y="109" width="430" height="14" rx="3" fill="#0A1F2E" stroke="#37677D" stroke-width="1"/>
      <rect x="380" y="109" height="14" rx="3" fill="#76D6A5" width="0">
<animate attributeName="width" from="0" to="387.0" dur="1s" begin="0.0s" fill="freeze"/>      </rect>
      <text x="822" y="121" font-size="13" fill="#EAF6FF">90%</text>
      <rect x="870" y="108" width="130" height="20" rx="3" fill="none" stroke="#76D6A5" stroke-width="1.5"/>
      <text x="935" y="121" font-size="10" letter-spacing="1" fill="#76D6A5" text-anchor="middle">OPERATIONAL</text>
    </g>
    <g>
      <title>FastAPI — Backend — OPERATIONAL (80%)</title>
      <text x="40" y="167" font-size="15" font-weight="600" fill="#EAF6FF">FastAPI<tspan font-size="12" fill="#648399" dx="8">// BACKEND</tspan></text>
      <rect x="380" y="155" width="430" height="14" rx="3" fill="#0A1F2E" stroke="#37677D" stroke-width="1"/>
      <rect x="380" y="155" height="14" rx="3" fill="#76D6A5" width="0">
<animate attributeName="width" from="0" to="344.0" dur="1s" begin="0.1s" fill="freeze"/>      </rect>
      <text x="822" y="167" font-size="13" fill="#EAF6FF">80%</text>
      <rect x="870" y="154" width="130" height="20" rx="3" fill="none" stroke="#76D6A5" stroke-width="1.5"/>
      <text x="935" y="167" font-size="10" letter-spacing="1" fill="#76D6A5" text-anchor="middle">OPERATIONAL</text>
    </g>
    <g>
      <title>React — Frontend — OPERATIONAL (75%)</title>
      <text x="40" y="213" font-size="15" font-weight="600" fill="#EAF6FF">React<tspan font-size="12" fill="#648399" dx="8">// FRONTEND</tspan></text>
      <rect x="380" y="201" width="430" height="14" rx="3" fill="#0A1F2E" stroke="#37677D" stroke-width="1"/>
      <rect x="380" y="201" height="14" rx="3" fill="#76D6A5" width="0">
<animate attributeName="width" from="0" to="322.5" dur="1s" begin="0.2s" fill="freeze"/>      </rect>
      <text x="822" y="213" font-size="13" fill="#EAF6FF">75%</text>
      <rect x="870" y="200" width="130" height="20" rx="3" fill="none" stroke="#76D6A5" stroke-width="1.5"/>
      <text x="935" y="213" font-size="10" letter-spacing="1" fill="#76D6A5" text-anchor="middle">OPERATIONAL</text>
    </g>
    <g>
      <title>TypeScript — Frontend — OPERATIONAL (75%)</title>
      <text x="40" y="259" font-size="15" font-weight="600" fill="#EAF6FF">TypeScript<tspan font-size="12" fill="#648399" dx="8">// FRONTEND</tspan></text>
      <rect x="380" y="247" width="430" height="14" rx="3" fill="#0A1F2E" stroke="#37677D" stroke-width="1"/>
      <rect x="380" y="247" height="14" rx="3" fill="#76D6A5" width="0">
<animate attributeName="width" from="0" to="322.5" dur="1s" begin="0.3s" fill="freeze"/>      </rect>
      <text x="822" y="259" font-size="13" fill="#EAF6FF">75%</text>
      <rect x="870" y="246" width="130" height="20" rx="3" fill="none" stroke="#76D6A5" stroke-width="1.5"/>
      <text x="935" y="259" font-size="10" letter-spacing="1" fill="#76D6A5" text-anchor="middle">OPERATIONAL</text>
    </g>
    <g>
      <title>Docker — Infrastructure — TRAINING (65%)</title>
      <text x="40" y="305" font-size="15" font-weight="600" fill="#EAF6FF">Docker<tspan font-size="12" fill="#648399" dx="8">// INFRASTRUCTURE</tspan></text>
      <rect x="380" y="293" width="430" height="14" rx="3" fill="#0A1F2E" stroke="#37677D" stroke-width="1"/>
      <rect x="380" y="293" height="14" rx="3" fill="#EAB768" width="0">
<animate attributeName="width" from="0" to="279.5" dur="1s" begin="0.4s" fill="freeze"/>      </rect>
      <text x="822" y="305" font-size="13" fill="#EAF6FF">65%</text>
      <rect x="870" y="292" width="130" height="20" rx="3" fill="none" stroke="#EAB768" stroke-width="1.5"/>
      <text x="935" y="305" font-size="10" letter-spacing="1" fill="#EAB768" text-anchor="middle">TRAINING</text>
    </g>
    <g>
      <title>Codex — Artificial Intelligence — ACTIVE (80%)</title>
      <text x="40" y="351" font-size="15" font-weight="600" fill="#EAF6FF">Codex<tspan font-size="12" fill="#648399" dx="8">// ARTIFICIAL INTELLIGENCE</tspan></text>
      <rect x="380" y="339" width="430" height="14" rx="3" fill="#0A1F2E" stroke="#37677D" stroke-width="1"/>
      <rect x="380" y="339" height="14" rx="3" fill="#76D6A5" width="0">
<animate attributeName="width" from="0" to="344.0" dur="1s" begin="0.5s" fill="freeze"/>      </rect>
      <text x="822" y="351" font-size="13" fill="#EAF6FF">80%</text>
      <rect x="870" y="338" width="130" height="20" rx="3" fill="none" stroke="#76D6A5" stroke-width="1.5"/>
      <text x="935" y="351" font-size="10" letter-spacing="1" fill="#76D6A5" text-anchor="middle">ACTIVE</text>
    </g>
  </g>
</svg>
