  <line x1="280.0" y1="100" x2="280.0" y2="196" stroke="#37677D" stroke-width="1" opacity=".5"/>
  <line x1="520.0" y1="100" x2="520.0" y2="196" stroke="#37677D" stroke-width="1" opacity=".5"/>
  <line x1="760.0" y1="100" x2="760.0" y2="196" stroke="#37677D" stroke-width="1" opacity=".5"/>
  <line x1="1000.0" y1="100" x2="1000.0" y2="196" stroke="#37677D" stroke-width="1" opacity=".5"/>
