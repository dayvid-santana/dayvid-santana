<!-- DSI GitHub Command Center | Autor: Dayvid Santana | Criado/Editado: 28/08/2026 | Objetivo: Renderizar o console animado de proficiência em linguagens. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="472" viewBox="0 0 1280 472" role="img" aria-labelledby="lc-title lc-desc">
  <title id="lc-title">DSI — Language Proficiency Console</title>
  <desc id="lc-desc">Proficiência em linguagens de programação calculada a partir dos repositórios públicos do operador.</desc>
  <defs>
    <pattern id="lc-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#17384A" stroke-width="1" opacity=".5"/></pattern>
  </defs>
  <rect width="1280" height="472" fill="#06131F"/>
  <rect width="1280" height="472" fill="url(#lc-grid)" opacity=".5"/>
  <rect x="1" y="1" width="1278" height="470" fill="none" stroke="#37677D" stroke-width="2"/>
  <rect x="0" y="-26" width="1280" height="26" fill="#74D9FF" opacity=".07">
    <animate attributeName="y" values="-26;472" dur="8s" repeatCount="indefinite"/>
  </rect>
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="40" y="48" font-size="20" font-weight="700" letter-spacing="2" fill="#EAF6FF">LANGUAGE PROFICIENCY</text>
    <text x="40" y="70" font-size="12" letter-spacing="2" fill="#648399">SOURCE CODE ANALYSIS // 3 REPOSITORIES SCANNED<tspan fill="#74D9FF"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>_</tspan></text>
    <circle cx="1152" cy="43" r="6" fill="#76D6A5"><animate attributeName="opacity" values="1;.35;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <text x="1168" y="48" font-size="13" font-weight="700" letter-spacing="1" fill="#74D9FF">OMEGA-CLASS TYPESCRIPT OPERATOR</text>
  </g>
  <path d="M40 90H1240" stroke="#74D9FF" stroke-width="1" opacity=".45"/>
  <g font-family="Consolas, 'Courier New', monospace">
    <g>
      <title>TypeScript — PRIMARY SPECIALIZATION (1 repo)</title>
      <text x="40" y="121" font-size="15" font-weight="600" fill="#EAF6FF">TypeScript</text>
      <rect x="380" y="109" width="500" height="14" rx="3" fill="#0A1F2E" stroke="#37677D" stroke-width="1"/>
      <rect x="380" y="109" height="14" rx="3" fill="#76D6A5" width="0">
<animate attributeName="width" from="0" to="437.1" dur="1s" begin="0.0s" fill="freeze"/>      </rect>
      <text x="892" y="121" font-size="13" fill="#EAF6FF">87.42%</text>
      <rect x="950" y="108" width="76" height="20" rx="3" fill="none" stroke="#76D6A5" stroke-width="1.5"/>
      <text x="988" y="121" font-size="11" letter-spacing="1" fill="#76D6A5" text-anchor="middle">OMEGA</text>
    </g>
    <g>
      <title>Python — OPERATIONAL PROFICIENCY (1 repo)</title>
      <text x="40" y="167" font-size="15" font-weight="600" fill="#EAF6FF">Python</text>
      <rect x="380" y="155" width="500" height="14" rx="3" fill="#0A1F2E" stroke="#37677D" stroke-width="1"/>
      <rect x="380" y="155" height="14" rx="3" fill="#EAB768" width="0">
<animate attributeName="width" from="0" to="30.1" dur="1s" begin="0.12s" fill="freeze"/>      </rect>
