      <rect x="950" y="246" width="76" height="20" rx="3" fill="none" stroke="#B7ECFF" stroke-width="1.5"/>
      <text x="988" y="259" font-size="11" letter-spacing="1" fill="#B7ECFF" text-anchor="middle">CHARLIE</text>
