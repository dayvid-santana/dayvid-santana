      <rect x="950" y="154" width="76" height="20" rx="3" fill="none" stroke="#EAB768" stroke-width="1.5"/>
      <text x="988" y="167" font-size="11" letter-spacing="1" fill="#EAB768" text-anchor="middle">BRAVO</text>
