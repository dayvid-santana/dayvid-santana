<animate attributeName="width" from="0" to="5.6" dur="1s" begin="0.48s" fill="freeze"/>      </rect>
      <text x="892" y="305" font-size="13" fill="#EAF6FF">1.12%</text>
      <rect x="950" y="292" width="76" height="20" rx="3" fill="none" stroke="#B7ECFF" stroke-width="1.5"/>
      <text x="988" y="305" font-size="11" letter-spacing="1" fill="#B7ECFF" text-anchor="middle">CHARLIE</text>
    </g>
