# DSI GitHub Command Center
# Autor: Dayvid Santana
# Criado em: 28/08/2026
# Editado em: 28/08/2026
# Objetivo: Centralizar metadados, dependências e ferramentas de qualidade do projeto.
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dsi-github-command-center"
version = "0.1.0"
description = "Gerador de perfil GitHub com identidade visual DSI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Dayvid Santana" }]
dependencies = [
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "markdown>=3.7,<4",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6.0,<7",
  "rich>=13.9,<14",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5.0,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
dsi-profile = "dsi_profile.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dsi_profile"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["dsi_profile"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
