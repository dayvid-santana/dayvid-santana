# Stack de desenvolvimento da Iara. A porta da API fica apenas na rede privada do Compose.
services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
    env_file:
      - path: ./Backend/.env
        required: false
    environment:
      APP_ENV: development
      IARA_DATABASE_PATH: /data/iara.sqlite3
      IARA_TRUSTED_LOCAL_PROXY_IPS: 172.30.250.2
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --reload
      - --reload-dir
      - /app/app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    volumes:
      - dados_sqlite:/data
      - ./Backend/app:/app/app:ro
      - ./Backend/sql:/app/sql:ro
      - ./Backend/fixtures:/app/fixtures:ro
    expose:
      - "8000"
    networks:
      rede_iara:
        ipv4_address: 172.30.250.3
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      target: desenvolvimento
    environment:
      IARA_API_PROXY_TARGET: http://backend:8000
      IARA_DOCKER_WATCH_POLLING: "true"
      IARA_DOCKER_ALLOWED_HOST: frontend
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
      - --port
      - "5173"
      - --strictPort
    volumes:
      - dependencias_frontend:/app/node_modules
      - ./Frontend/src:/app/src:ro
      - ./Frontend/styles:/app/styles:ro
      - ./Frontend/public:/app/public:ro
      - ./Frontend/index.html:/app/index.html:ro
      - ./Frontend/vite.config.ts:/app/vite.config.ts:ro
    expose:
      - "5173"
    networks:
      rede_iara:
        ipv4_address: 172.30.250.2
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(resposta => process.exit(resposta.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  e2e:
    profiles: [test]
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      target: testes-integrados
    environment:
      IARA_E2E_EXTERNAL_SERVERS: "1"
      IARA_E2E_BASE_URL: http://frontend:5173
      IARA_E2E_API_BASE_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      rede_iara:
        ipv4_address: 172.30.250.4

networks:
  rede_iara:
    ipam:
      config:
        - subnet: 172.30.250.0/29

volumes:
  dados_sqlite:
  dependencias_frontend:
