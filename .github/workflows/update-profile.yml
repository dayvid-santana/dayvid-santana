# DSI GitHub Command Center
# Autor: Dayvid Santana
# Criado em: 28/08/2026
# Editado em: 28/08/2026
# Objetivo: Manter a proficiência em linguagens e o perfil DSI sempre atualizados.
name: Update DSI Profile

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dsi-profile-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install -e .

      - name: Fetch language proficiency data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dsi-profile fetch-languages

      - name: Fetch mission telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dsi-profile fetch-stats

      - name: Regenerate profile
        run: dsi-profile generate

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/languages.json data/mission-stats.json README.md assets/
          if git diff --cached --quiet; then
            echo "Nenhuma mudança na telemetria do perfil."
          else
            git commit -m "chore: atualizar telemetria e perfil DSI"
            git push
          fi
